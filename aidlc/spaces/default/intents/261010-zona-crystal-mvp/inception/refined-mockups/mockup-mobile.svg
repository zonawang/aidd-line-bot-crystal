<svg xmlns="http://www.w3.org/2000/svg" width="375" height="2120" viewBox="0 0 375 2120" role="img" aria-labelledby="title desc"><title id="title">Zona Crystal 375 CSS px 靜態介面設計</title><desc id="desc">生日與生命靈數之後的三卡畫面，含身分、三追問、額外捷徑、文字圖片輸入、選單及教學說明。僅設計示意，不是可運作 Bot。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}</style><rect width="375" height="2120" fill="#F7F6FA"/><text x="16" y="40" font-size="24" fill="#242033" font-weight="700">Zona Crystal</text><text x="16" y="68" font-size="14" fill="#5C566B" font-weight="400">本機教學模式 · 靜態設計示意</text><text x="16" y="96" font-size="14" fill="#5C566B" font-weight="400">驗證寬度 375 CSS px · 按鈕為示意</text><rect x="16" y="112" width="343" height="88" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="32" y="141" font-size="16" fill="#242033" font-weight="600">目前身分 A · 諮詢模式</text><rect x="32" y="148" width="76" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="44" y="176" font-size="16" fill="#FFFFFF" font-weight="500">A</text><rect x="116" y="148" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="128" y="176" font-size="16" fill="#242033" font-weight="500">B</text><text x="204" y="178" font-size="14" fill="#5C566B" font-weight="400">切換展示身分</text><text x="16" y="234" font-size="20" fill="#242033" font-weight="600">對話與推薦</text><rect x="16" y="250" width="343" height="82" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="32" y="278" font-size="16" fill="#242033" font-weight="400">已選生日：2000-01-01</text><text x="32" y="307" font-size="16" fill="#242033" font-weight="400">生命靈數 4 · 教學情境參考</text><text x="16" y="368" font-size="20" fill="#242033" font-weight="600">推薦水晶 · 三張不同卡</text><rect x="16" y="388" width="343" height="224" rx="12" fill="#FFFFFF" stroke="#756B85"/><rect x="28" y="400" width="319" height="80" rx="8" fill="#F7F6FA" stroke="none"/><path d="M 187.5 412 L 212.5 436 L 202.5 465 L 172.5 465 L 162.5 436 Z" fill="#4B0082" opacity=".45"/><text x="40" y="446" font-size="14" fill="#242033" font-weight="400">原圖片位置</text><text x="32" y="510" font-size="18" fill="#242033" font-weight="600">紫水晶</text><text x="32" y="538" font-size="14" fill="#5C566B" font-weight="400">學習與專注的教學情境</text><rect x="32" y="552" width="311" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="44" y="580" font-size="16" fill="#FFFFFF" font-weight="500">選擇紫水晶</text><rect x="16" y="628" width="343" height="224" rx="12" fill="#FFFFFF" stroke="#756B85"/><rect x="28" y="640" width="319" height="80" rx="8" fill="#F7F6FA" stroke="none"/><path d="M 187.5 652 L 212.5 676 L 202.5 705 L 172.5 705 L 162.5 676 Z" fill="#D07080" opacity=".45"/><text x="40" y="686" font-size="14" fill="#242033" font-weight="400">原圖片位置</text><text x="32" y="750" font-size="18" fill="#242033" font-weight="600">粉晶</text><text x="32" y="778" font-size="14" fill="#5C566B" font-weight="400">關係與和諧的教學情境</text><rect x="32" y="792" width="311" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="44" y="820" font-size="16" fill="#FFFFFF" font-weight="500">選擇粉晶</text><rect x="16" y="868" width="343" height="224" rx="12" fill="#FFFFFF" stroke="#756B85"/><rect x="28" y="880" width="319" height="80" rx="8" fill="#F7F6FA" stroke="none"/><path d="M 187.5 892 L 212.5 916 L 202.5 945 L 172.5 945 L 162.5 916 Z" fill="#B8860B" opacity=".45"/><text x="40" y="926" font-size="14" fill="#242033" font-weight="400">原圖片位置</text><text x="32" y="990" font-size="18" fill="#242033" font-weight="600">黃水晶</text><text x="32" y="1018" font-size="14" fill="#5C566B" font-weight="400">事業與信心的教學情境</text><rect x="32" y="1032" width="311" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="44" y="1060" font-size="16" fill="#FFFFFF" font-weight="500">選擇黃水晶</text><rect x="16" y="1128" width="343" height="104" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="32" y="1157" font-size="18" fill="#242033" font-weight="600">星曜守護導師 艾蓮</text><text x="32" y="1186" font-size="16" fill="#242033" font-weight="400">選卡後在此顯示對應水晶介紹</text><text x="32" y="1214" font-size="14" fill="#5C566B" font-weight="400">教學範例回覆</text><text x="16" y="1264" font-size="20" fill="#242033" font-weight="600">繼續探索 · 三個追問</text><rect x="16" y="1284" width="343" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="28" y="1312" font-size="16" fill="#242033" font-weight="500">如何淨化這顆水晶？</text><rect x="16" y="1336" width="343" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="28" y="1364" font-size="16" fill="#242033" font-weight="500">如何搭配其他水晶？</text><rect x="16" y="1388" width="343" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="28" y="1416" font-size="16" fill="#242033" font-weight="500">有哪些佩戴注意事項？</text><text x="16" y="1452" font-size="16" fill="#5C566B" font-weight="400">其他快捷動作</text><rect x="16" y="1468" width="116" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="28" y="1496" font-size="16" fill="#242033" font-weight="500">選擇生日</text><rect x="140" y="1468" width="219" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="152" y="1496" font-size="16" fill="#242033" font-weight="500">了解我的生命靈數</text><text x="16" y="1540" font-size="20" fill="#242033" font-weight="600">訊息或圖片</text><rect x="16" y="1556" width="343" height="52" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="28" y="1589" font-size="14" fill="#5C566B" font-weight="400">輸入問題或文字生日，例如 2000-01-01</text><rect x="16" y="1616" width="100" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="28" y="1644" font-size="16" fill="#FFFFFF" font-weight="500">送出訊息</text><rect x="124" y="1616" width="116" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="136" y="1644" font-size="16" fill="#242033" font-weight="500">選擇圖片</text><rect x="248" y="1616" width="111" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="260" y="1644" font-size="16" fill="#242033" font-weight="500">送出圖片</text><text x="16" y="1692" font-size="18" fill="#242033" font-weight="600">選單與指南 · LINE 操作模擬</text><rect x="16" y="1708" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="28" y="1736" font-size="16" fill="#242033" font-weight="500">切換五宮格</text><rect x="184" y="1708" width="175" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="196" y="1736" font-size="16" fill="#242033" font-weight="500">使用指南</text><rect x="16" y="1760" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="28" y="1788" font-size="16" fill="#242033" font-weight="500">進入 Echo</text><rect x="184" y="1760" width="175" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="196" y="1788" font-size="16" fill="#242033" font-weight="500">今日水晶推薦</text><rect x="16" y="1832" width="343" height="148" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="32" y="1861" font-size="18" fill="#242033" font-weight="600">教學說明（可收合）</text><text x="32" y="1889" font-size="14" fill="#242033" font-weight="400">A → B 隔離 → 重啟再選 A</text><text x="32" y="1916" font-size="14" fill="#242033" font-weight="400">等待／錯誤均有文字與下一步</text><text x="32" y="1943" font-size="14" fill="#242033" font-weight="400">圖片範例、LINE 模擬就近標示</text><text x="32" y="1968" font-size="14" fill="#242033" font-weight="400">外部服務／手機結果另列</text></svg>

