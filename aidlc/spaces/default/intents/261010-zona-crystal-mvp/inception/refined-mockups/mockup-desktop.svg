<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1320" viewBox="0 0 1280 1320" role="img" aria-labelledby="title desc"><title id="title">Zona Crystal 1280 CSS px 靜態介面設計</title><desc id="desc">生日與生命靈數之後的三卡畫面，含身分、三追問、額外捷徑、文字圖片輸入、選單及教學說明。僅設計示意，不是可運作 Bot。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}</style><rect width="1280" height="1320" fill="#F7F6FA"/><text x="80" y="40" font-size="24" fill="#242033" font-weight="700">Zona Crystal</text><text x="80" y="68" font-size="14" fill="#5C566B" font-weight="400">本機教學模式 · 靜態設計示意</text><text x="80" y="96" font-size="14" fill="#5C566B" font-weight="400">驗證寬度 1280 CSS px · 按鈕為示意</text><rect x="80" y="112" width="776" height="88" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="96" y="141" font-size="16" fill="#242033" font-weight="600">目前身分 A · 諮詢模式</text><rect x="96" y="148" width="76" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="108" y="176" font-size="16" fill="#FFFFFF" font-weight="500">A</text><rect x="180" y="148" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="192" y="176" font-size="16" fill="#242033" font-weight="500">B</text><text x="268" y="178" font-size="14" fill="#5C566B" font-weight="400">切換展示身分</text><text x="80" y="234" font-size="20" fill="#242033" font-weight="600">對話與推薦</text><rect x="80" y="250" width="776" height="82" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="96" y="278" font-size="16" fill="#242033" font-weight="400">已選生日：2000-01-01</text><text x="96" y="307" font-size="16" fill="#242033" font-weight="400">生命靈數 4 · 教學情境參考</text><text x="80" y="368" font-size="20" fill="#242033" font-weight="600">推薦水晶 · 三張不同卡</text><rect x="80" y="388" width="248" height="224" rx="12" fill="#FFFFFF" stroke="#756B85"/><rect x="92" y="400" width="224" height="80" rx="8" fill="#F7F6FA" stroke="none"/><path d="M 204 412 L 229 436 L 219 465 L 189 465 L 179 436 Z" fill="#4B0082" opacity=".45"/><text x="104" y="446" font-size="14" fill="#242033" font-weight="400">原圖片位置</text><text x="96" y="510" font-size="18" fill="#242033" font-weight="600">紫水晶</text><text x="96" y="538" font-size="14" fill="#5C566B" font-weight="400">學習與專注的教學情境</text><rect x="96" y="552" width="216" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="108" y="580" font-size="16" fill="#FFFFFF" font-weight="500">選擇紫水晶</text><rect x="344" y="388" width="248" height="224" rx="12" fill="#FFFFFF" stroke="#756B85"/><rect x="356" y="400" width="224" height="80" rx="8" fill="#F7F6FA" stroke="none"/><path d="M 468 412 L 493 436 L 483 465 L 453 465 L 443 436 Z" fill="#D07080" opacity=".45"/><text x="368" y="446" font-size="14" fill="#242033" font-weight="400">原圖片位置</text><text x="360" y="510" font-size="18" fill="#242033" font-weight="600">粉晶</text><text x="360" y="538" font-size="14" fill="#5C566B" font-weight="400">關係與和諧的教學情境</text><rect x="360" y="552" width="216" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="372" y="580" font-size="16" fill="#FFFFFF" font-weight="500">選擇粉晶</text><rect x="608" y="388" width="248" height="224" rx="12" fill="#FFFFFF" stroke="#756B85"/><rect x="620" y="400" width="224" height="80" rx="8" fill="#F7F6FA" stroke="none"/><path d="M 732 412 L 757 436 L 747 465 L 717 465 L 707 436 Z" fill="#B8860B" opacity=".45"/><text x="632" y="446" font-size="14" fill="#242033" font-weight="400">原圖片位置</text><text x="624" y="510" font-size="18" fill="#242033" font-weight="600">黃水晶</text><text x="624" y="538" font-size="14" fill="#5C566B" font-weight="400">事業與信心的教學情境</text><rect x="624" y="552" width="216" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="636" y="580" font-size="16" fill="#FFFFFF" font-weight="500">選擇黃水晶</text><rect x="80" y="648" width="776" height="104" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="96" y="677" font-size="18" fill="#242033" font-weight="600">星曜守護導師 艾蓮</text><text x="96" y="706" font-size="16" fill="#242033" font-weight="400">選卡後在此顯示對應水晶介紹</text><text x="96" y="734" font-size="14" fill="#5C566B" font-weight="400">教學範例回覆</text><text x="80" y="784" font-size="20" fill="#242033" font-weight="600">繼續探索 · 三個追問</text><rect x="80" y="804" width="248" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="92" y="832" font-size="16" fill="#242033" font-weight="500">如何淨化這顆水晶？</text><rect x="344" y="804" width="248" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="356" y="832" font-size="16" fill="#242033" font-weight="500">如何搭配其他水晶？</text><rect x="608" y="804" width="248" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="620" y="832" font-size="16" fill="#242033" font-weight="500">有哪些佩戴注意事項？</text><text x="80" y="872" font-size="16" fill="#5C566B" font-weight="400">其他快捷動作</text><rect x="80" y="888" width="116" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="92" y="916" font-size="16" fill="#242033" font-weight="500">選擇生日</text><rect x="204" y="888" width="219" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="216" y="916" font-size="16" fill="#242033" font-weight="500">了解我的生命靈數</text><text x="80" y="960" font-size="20" fill="#242033" font-weight="600">訊息或圖片</text><rect x="80" y="976" width="776" height="52" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="92" y="1009" font-size="16" fill="#5C566B" font-weight="400">輸入問題或文字生日，例如 2000-01-01</text><rect x="80" y="1036" width="100" height="44" rx="8" fill="#4B0082" stroke="#4B0082"/><text x="92" y="1064" font-size="16" fill="#FFFFFF" font-weight="500">送出訊息</text><rect x="188" y="1036" width="116" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="200" y="1064" font-size="16" fill="#242033" font-weight="500">選擇圖片</text><rect x="312" y="1036" width="111" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="324" y="1064" font-size="16" fill="#242033" font-weight="500">送出圖片</text><text x="80" y="1112" font-size="18" fill="#242033" font-weight="600">選單與指南 · LINE 操作模擬</text><rect x="80" y="1128" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="92" y="1156" font-size="16" fill="#242033" font-weight="500">切換五宮格</text><rect x="248" y="1128" width="175" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="260" y="1156" font-size="16" fill="#242033" font-weight="500">使用指南</text><rect x="80" y="1180" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="92" y="1208" font-size="16" fill="#242033" font-weight="500">進入 Echo</text><rect x="248" y="1180" width="175" height="44" rx="8" fill="#FFFFFF" stroke="#756B85"/><text x="260" y="1208" font-size="16" fill="#242033" font-weight="500">今日水晶推薦</text><rect x="880" y="112" width="320" height="870" rx="12" fill="#FFFFFF" stroke="#756B85"/><text x="900" y="150" font-size="20" fill="#242033" font-weight="600">教學與分享</text><text x="900" y="192" font-size="14" fill="#5C566B" font-weight="400">先走生日 → 三卡 → 選卡</text><text x="900" y="227" font-size="14" fill="#5C566B" font-weight="400">再展示文字／圖片、角色、追問</text><text x="900" y="262" font-size="14" fill="#5C566B" font-weight="400">接著 A／B、重啟、選單與 Echo</text><text x="900" y="297" font-size="14" fill="#5C566B" font-weight="400"></text><text x="900" y="332" font-size="14" fill="#5C566B" font-weight="400">範例／模擬就近標示</text><text x="900" y="367" font-size="14" fill="#5C566B" font-weight="400">外部服務／LINE 手機證據另列</text><text x="900" y="402" font-size="14" fill="#5C566B" font-weight="400"></text><text x="900" y="437" font-size="14" fill="#242033" font-weight="600">畫面狀態</text><text x="900" y="472" font-size="14" fill="#5C566B" font-weight="400">初始：歡迎與全部功能入口</text><text x="900" y="507" font-size="14" fill="#5C566B" font-weight="400">等待：正在整理回覆</text><text x="900" y="542" font-size="14" fill="#5C566B" font-weight="400">錯誤：說明原因並可重試</text><text x="900" y="577" font-size="14" fill="#5C566B" font-weight="400">部分可用：圖片失敗仍有文字</text><text x="900" y="612" font-size="14" fill="#5C566B" font-weight="400"></text><text x="900" y="647" font-size="14" fill="#5C566B" font-weight="400">四角色原示例見教學清單</text><text x="900" y="682" font-size="14" fill="#5C566B" font-weight="400">保留原素材與七款卡池</text><text x="900" y="717" font-size="14" fill="#5C566B" font-weight="400">#水晶與原分享連結保留</text><text x="80" y="1288" font-size="14" fill="#5C566B" font-weight="400">此圖僅為設計參考，功能與操作測試仍待實作。</text></svg>

