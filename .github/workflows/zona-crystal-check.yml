name: Zona Crystal check
on:
  push:
  pull_request:
jobs:
  u1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check:u1
      - run: npm audit --audit-level=moderate
